<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__image_container">
            <img class="profile__image" src="" alt="Avatar" />
            <div>
              <img
                class="profile__image-edit-icon"
                src="/src/images/editar.png"
                alt="icono editar"
              />
            </div>
          </div>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description"></p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form" name="popupEdit">
            <input
              class="popup__input popup__input_type_name"
              name="name"
              id="name"
              minlength="2"
              maxlength="40"
              placeholder="Nombre"
              type="text"
              required
            />
            <span class="name-input-error popup__input-error"></span>
            <input
              class="popup__input popup__input_type_description"
              name="description"
              id="description"
              minlength="2"
              maxlength="200"
              placeholder="Acerca de mí"
              type="text"
              required
            />
            <span class="description-input-error popup__input-error"></span>
            <button
              class="button popup__button popup__button-submit"
              type="submit"
              disabled
            >
              Guardar
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form" name="popupPlace">
            <input
              class="popup__input popup__input_type_card-name"
              name="name"
              id="place"
              minlength="2"
              maxlength="30"
              placeholder="Título"
              required
              type="text"
            />
            <span class="place-input-error popup__input-error"></span>
            <input
              class="popup__input popup__input_type_url"
              name="link"
              id="link"
              placeholder="Enlace a la imagen"
              required
              type="url"
            />
            <span class="link-input-error popup__input-error"></span>
            <button
              class="button popup__button popup__button-submit"
              type="submit"
              disabled
            >
              Crear
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
      <div class="popup" id="confirm-popup">
        <div class="popup__content-confirm">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">¿Estas seguro?</h3>
          <form
            class="popup__form"
            id="confirm-delete-form"
            name="popupConfirm"
          >
            <button
              class="button popup__button popup__button-submit"
              type="submit"
            >
              Sí
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="edit-profile-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Cambiar foto de perfil</h3>
          <form class="popup__form" id="edit-profile-form" name="popupEdit">
            <input
              class="popup__input popup__input_type_name"
              name="avatar"
              id="profile_photo"
              minlength="2"
              placeholder="Link de Imagen"
              type="text"
              required
            />
            <span class="name-input-error popup__input-error"></span>
            <button
              class="button popup__button popup__button-submit"
              type="submit"
            >
              Guardar
            </button>
          </form>
        </div>
      </div>
    </div>
    <template id="card__template">
      <li class="card">
        <img class="card__image" src="" alt="" />
        <button
          aria-label="Eliminar tarjeta"
          class="card__delete-button"
          type="button"
        ></button>
        <div class="card__description">
          <h2 class="card__title"></h2>
          <button
            aria-label="Botón Me gusta"
            class="card__like-button"
            type="button"
          ></button>
        </div>
      </li>
    </template>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
